<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Account - DudeConvert</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-100">
        <h2 class="text-2xl font-black text-slate-800 mb-2 text-center">Get Started</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Create a free account to unlock local document core
            processing</p>

        <div th:if="${error}" class="bg-red-50 text-red-600 p-3 rounded-xl text-xs font-semibold mb-4 text-center"
            th:text="${error}"></div>

        <form action="/signup" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Username</label>
                <input type="text" name="username"
                    class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-indigo-500"
                    placeholder="Create username" required>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Password</label>
                <input type="password" name="password"
                    class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-indigo-500"
                    placeholder="••••••••" required>
            </div>
            <button type="submit"
                class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold text-sm hover:bg-indigo-700 shadow-md">Create
                Account</button>
        </form>
        <p class="text-xs text-center text-slate-400 mt-6">Already have an account? <a href="/login"
                class="text-indigo-600 font-bold hover:underline">Log In</a></p>
    </div>
</body>

</html>
